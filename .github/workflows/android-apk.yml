name: Build MetaShield Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare & Normalize Project Sources for Cloud CI
        run: |
          python3 - << 'EOF'
          import os, re

          # Ensure gradle.properties disables external JitPack NDK build during unauthenticated CI
          if os.path.exists("gradle.properties"):
              with open("gradle.properties", "r", encoding="utf-8") as f:
                  gp = f.read()
              gp = gp.replace("metashield.enableC2paNativeAar=true", "metashield.enableC2paNativeAar=false")
              with open("gradle.properties", "w", encoding="utf-8") as f:
                  f.write(gp)

          # Repair any literal NUL bytes or unescaped regex quotes if repo was created from initial upload
          for dp, _, fns in os.walk("app/src"):
              for fn in fns:
                  if not fn.endswith(".kt"):
                      continue
                  p = os.path.join(dp, fn)
                  raw = open(p, "rb").read()
                  if b"\x00" in raw:
                      raw = raw.replace(b"\x00", b"\\u0000")
                  txt = raw.decode("utf-8")
                  txt = txt.replace('Regex("[^a-zA-Z0-9._\\-]")', 'Regex("[^a-zA-Z0-9._\\\\-]")')
                  txt = txt.replace('Regex("[^a-zA-Z0-9_\\-]")', 'Regex("[^a-zA-Z0-9_\\\\-]")')
                  txt = txt.replace('Regex("([a-zA-Z0-9_]+:[a-zA-Z0-9_]+)\\s*=\\s*"([^"]+)"")', 'Regex("([a-zA-Z0-9_]+:[a-zA-Z0-9_]+)\\\\s*=\\\\s*\\"([^\\"]+)\\"")')
                  txt = txt.replace('Regex("<([a-zA-Z0-9_]+:[a-zA-Z0-9_]+)>([^<]+)</\\1>")', 'Regex("<([a-zA-Z0-9_]+:[a-zA-Z0-9_]+)>([^<]+)</\\\\1>")')
                  txt = txt.replace('Regex(""${Regex.escape(key)}"\\s*:\\s*"([^"]+)"")', 'Regex("\\"${Regex.escape(key)}\\"\\\\s*:\\\\s*\\"([^\\"]+)\\"")')
                  txt = txt.replace('Regex("[A-Za-z0-9_./:\\- ]{3,64}")', 'Regex("[A-Za-z0-9_./:\\\\- ]{3,64}")')
                  txt = txt.replace('Regex(""ingredient"\\s*:\\s*"([^"]+)"")', 'Regex("\\"ingredient\\"\\\\s*:\\\\s*\\"([^\\"]+)\\"")')
                  if "private fun buildManifestSummaryJson" in txt and '\\"\\"\\"' in txt:
                      idx = txt.index("private fun buildManifestSummaryJson")
                      txt = txt[:idx] + '''private fun buildManifestSummaryJson(
        detail: C2paManifestDetail,
        status: C2paValidationStatus,
        errors: List<String>
    ): String {
        return "{\\"active_manifest\\":\\"${detail.manifestId}\\",\\"validation_state\\":\\"${status.name}\\"}"
    }
}
'''
                  with open(p, "w", encoding="utf-8") as f:
                      f.write(txt)
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Collect Built APK Files
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/MetaShield-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist-apk/MetaShield-release.apk
          ls -lh dist-apk/

      - name: Upload APK Artifact to Workflow Summary
        uses: actions/upload-artifact@v4
        with:
          name: MetaShield-APK
          path: |
            dist-apk/MetaShield-debug.apk
            dist-apk/MetaShield-release.apk
          if-no-files-found: error

      - name: Publish Direct .apk Files to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MetaShield Android APK (Build #${{ github.run_number }})"
          body: |
            ### Direct Android Phone APK Download
            Tap **`MetaShield-debug.apk`** or **`MetaShield-release.apk`** under **Assets** below to download the `.apk` file directly to your phone and install it (no `.tar` or `.zip` extraction needed!).
          files: |
            dist-apk/MetaShield-debug.apk
            dist-apk/MetaShield-release.apk
